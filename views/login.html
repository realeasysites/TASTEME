<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Login · Taste ME</title>
  <link rel="icon" href="/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#ffcf00;font-family:'DM Sans',system-ui,sans-serif;color:#0b2a6b;padding:20px}
    .card{background:#fff;border:3px solid #0b2a6b;border-radius:22px;box-shadow:8px 8px 0 #005ab4;padding:36px 30px;width:100%;max-width:380px;text-align:center}
    img{width:220px;max-width:100%}
    h1{font-family:'Lilita One',sans-serif;font-weight:400;font-size:1.5rem;margin:14px 0 22px}
    input{width:100%;padding:14px 16px;border:2px solid #0b2a6b;border-radius:12px;font:inherit;font-size:1rem}
    button{margin-top:14px;width:100%;padding:14px;border:0;border-radius:999px;background:#005ab4;color:#fff;font:inherit;font-weight:700;font-size:1rem;cursor:pointer}
    button:hover{background:#0b2a6b}
    .err{color:#c62828;min-height:1.3em;margin-top:12px;font-size:.92rem}
  </style>
</head>
<body>
  <form class="card" id="login">
    <img src="/images/wordmark.png" alt="Taste ME">
    <h1>Inquiry Dashboard</h1>
    <input type="password" name="password" placeholder="Password" autocomplete="current-password" required autofocus aria-label="Password">
    <button type="submit">Sign in</button>
    <div class="err" id="err" role="alert"></div>
  </form>
  <script>
    document.getElementById('login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('err');
      err.textContent = '';
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: e.target.password.value })
      });
      if (res.ok) return location.reload();
      const data = await res.json().catch(() => ({}));
      err.textContent = data.error || 'Could not sign in.';
    });
  </script>
</body>
</html>
